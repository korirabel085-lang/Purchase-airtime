<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airtime Auto Purchase</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 30px 40px;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 320px;
      }
      h2 {
        margin-bottom: 20px;
        color: #333;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #0056b3;
      }
      p {
        margin-top: 20px;
        font-size: 15px;
        color: #444;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Trigger Airtime Purchase</h2>
      <p>Airtime: <b>10 KES</b> → <b>0718369524</b></p>
      <button id="buyBtn">Buy Airtime</button>
      <p id="status"></p>
    </div>

    <script>
      // === Settings ===
      const backendURL = "https://airtimesellg.onrender.com/airtime/topup";
      const phoneNumber = "254718369524"; // your hardcoded number
      const amount = 10;

      const status = document.getElementById("status");
      const button = document.getElementById("buyBtn");

      async function triggerPurchase() {
        status.textContent = "⏳ Sending airtime request...";
        button.disabled = true;

        try {
          const res = await fetch(backendURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone_number: phoneNumber, amount }),
          });

          const data = await res.json();
          console.log("Response:", data);

          if (res.ok) {
            status.textContent =
              "✅ Airtime purchase triggered successfully! Check your line.";
          } else {
            status.textContent =
              "⚠️ Failed: " + (data.error || JSON.stringify(data));
          }
        } catch (err) {
          console.error(err);
          status.textContent = "❌ Network or server error.";
        } finally {
          button.disabled = false;
        }
      }

      // Manual trigger
      button.addEventListener("click", triggerPurchase);

      // 🔁 Optional auto trigger on page load
      // Uncomment this line if you want automatic purchase every time page opens:
      // window.addEventListener("load", triggerPurchase);
    </script>
  </body>
</html>
